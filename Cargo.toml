[package]
name = "scr"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.23"
ipnet = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "=2.0.0"
takumi = { version = "=2.17.1", default-features = false, features = ["raster-backend", "from-html", "png", "woff", "woff2", "svg-source"] }
takumi-core = { version = "=0.32.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
url = "2"

[profile.release]
lto = "thin"
strip = true
